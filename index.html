<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>イロノアマオト</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #b8bdc4;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #fff;
    touch-action: none;
  }

  .title {
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    left: 24px;
    letter-spacing: 0.16em;
    font-size: 17px;
    font-weight: 300;
    color: #aeb6bf;
    z-index: 10;
    pointer-events: none;
  }

  .subtitle {
    position: fixed;
    top: calc(max(22px, env(safe-area-inset-top)) + 28px);
    left: 26px;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #d0d5da;
    z-index: 10;
    pointer-events: none;
  }

  .ui {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 9px;
    align-items: center;
    background: rgba(255,255,255,0.78);
    padding: 11px 12px;
    border-radius: 999px;
    backdrop-filter: blur(20px);
    border: 1px solid rgba(225,232,238,0.8);
    box-shadow: 0 18px 45px rgba(150,165,180,0.13);
    z-index: 10;
    max-width: calc(100vw - 18px);
    overflow-x: auto;
  }

  button {
    border: 1px solid rgba(225,230,236,0.9);
    background: rgba(255,255,255,0.78);
    color: #aeb5bd;
    border-radius: 999px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }

  .color {
    width: 38px;
    height: 38px;
    min-width: 38px;
    padding: 0;
    border-radius: 50%;
    color: rgba(255,255,255,0.94);
    font-size: 10px;
    font-weight: 500;
    text-shadow: 0 1px 5px rgba(70,80,90,0.25);
  }

  .selected {
    outline: 3px solid rgba(190,202,214,0.36);
    transform: translateY(-2px);
  }

  .volume {
    width: 70px;
    accent-color: #b8bdc4;
  }

  @media (max-width: 700px) {
    .title { font-size: 15px; left: 18px; }
    .subtitle { left: 20px; }
    .ui { gap: 7px; padding: 10px; }
    button { font-size: 11px; padding: 8px 10px; }
    .color {
      width: 34px;
      height: 34px;
      min-width: 34px;
    }
    .volume { width: 58px; }
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="title">イロノアマオト</div>
<div class="subtitle">before the rainbow appears</div>

<div class="ui" id="buttons"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 300));

const notes = [
  { name: "ド", key: "a", color: "#ff7b7b", freq: 261.63 },
  { name: "レ", key: "s", color: "#ffe680", freq: 293.66 },
  { name: "ミ", key: "d", color: "#91e6a3", freq: 329.63 },
  { name: "ファ", key: "f", color: "#ffb36b", freq: 349.23 },
  { name: "ソ", key: "g", color: "#8ed8ff", freq: 392.00 },
  { name: "ラ", key: "h", color: "#bca7ff", freq: 440.00 },
  { name: "シ", key: "j", color: "#ffb3cf", freq: 493.88 },
  { name: "高ド", key: "k", color: "#ff8f8f", freq: 523.25 }
];

let current = notes[0];
let mode = "normal";
let volume = 0.85;

let inks = [];
let ripples = [];
let washing = false;
let washPower = 0;

const activePointers = new Map();

const buttons = document.getElementById("buttons");

notes.forEach(note => {
  const btn = document.createElement("button");
  btn.className = "color";
  btn.textContent = note.name;
  btn.title = `${note.name} / ${note.key.toUpperCase()}`;
  btn.style.background = note.color;

  btn.onclick = () => {
    mode = "normal";
    current = note;
    updateSelected();
    playTap(note);
    addRipple(w / 2, h / 2, note.color);
  };

  buttons.appendChild(btn);
  note.button = btn;
});

const randomBtn = document.createElement("button");
randomBtn.textContent = "Random";
randomBtn.onclick = () => {
  mode = "random";
  current = randomNote();
  updateSelected();
};
buttons.appendChild(randomBtn);

const chordBtn = document.createElement("button");
chordBtn.textContent = "Chord";
chordBtn.onclick = () => {
  mode = "chord";
  current = randomNote();
  updateSelected();
};
buttons.appendChild(chordBtn);

const clearBtn = document.createElement("button");
clearBtn.textContent = "Clear";
clearBtn.onclick = () => {
  washing = true;
  washPower = 1;
  stopAllSounds();
};
buttons.appendChild(clearBtn);

const fullBtn = document.createElement("button");
fullBtn.textContent = "Full";
fullBtn.onclick = () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
};
buttons.appendChild(fullBtn);

const volumeSlider = document.createElement("input");
volumeSlider.className = "volume";
volumeSlider.type = "range";
volumeSlider.min = 0;
volumeSlider.max = 1;
volumeSlider.step = 0.01;
volumeSlider.value = volume;
volumeSlider.oninput = e => {
  volume = Number(e.target.value);
};
buttons.appendChild(volumeSlider);

function updateSelected() {
  notes.forEach(n => n.button.classList.remove("selected"));
  current.button.classList.add("selected");
}

function randomNote() {
  return notes[Math.floor(Math.random() * notes.length)];
}

updateSelected();

/* ---------- Audio ---------- */
let audioCtx;
let oldSounds = [];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function createSoftGlass(freq, baseVolume = 0.12) {
  initAudio();

  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc1.type = "sine";
  osc2.type = "sine";

  osc1.frequency.value = freq;
  osc2.frequency.value = freq * 2.01;

  filter.type = "lowpass";
  filter.frequency.value = 1700;
  filter.Q.value = 2;

  gain.gain.value = 0.0001;

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start();
  osc2.start();

  return { osc1, osc2, gain, baseVolume };
}

function playTap(note) {
  initAudio();

  const freqs = mode === "chord"
    ? [note.freq, note.freq * 1.25, note.freq * 1.5]
    : [note.freq];

  const vol = (mode === "chord" ? 0.035 : 0.11) * volume;
  const dur = mode === "chord" ? 2.0 : 1.4;

  freqs.forEach(freq => {
    const v = createSoftGlass(freq, vol);
    v.gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), audioCtx.currentTime + 0.06);
    v.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    v.osc1.stop(audioCtx.currentTime + dur + 0.1);
    v.osc2.stop(audioCtx.currentTime + dur + 0.1);
    oldSounds.push(v);
  });

  fadeOldSounds();
}

function startPointerSound(pointerId, note) {
  initAudio();

  const freqs = mode === "chord"
    ? [note.freq, note.freq * 1.25, note.freq * 1.5]
    : [note.freq];

  const vol = (mode === "chord" ? 0.026 : 0.085) * volume;
  const voices = freqs.map(freq => {
    const v = createSoftGlass(freq, vol);
    v.gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), audioCtx.currentTime + 0.18);
    return v;
  });

  return voices;
}

function stopPointerSound(pointerId) {
  if (!audioCtx) return;
  const data = activePointers.get(pointerId);
  if (!data || !data.voices) return;

  data.voices.forEach(v => {
    try {
      v.gain.gain.cancelScheduledValues(audioCtx.currentTime);
      v.gain.gain.setValueAtTime(Math.max(v.gain.gain.value, 0.0001), audioCtx.currentTime);
      v.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
      v.osc1.stop(audioCtx.currentTime + 0.95);
      v.osc2.stop(audioCtx.currentTime + 0.95);
    } catch(e) {}
  });
}

function stopAllSounds() {
  for (const pointerId of activePointers.keys()) {
    stopPointerSound(pointerId);
  }
  activePointers.clear();
}

function fadeOldSounds() {
  while (oldSounds.length > 5) {
    const old = oldSounds.shift();
    if (audioCtx) {
      old.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    }
  }
}

/* ---------- Visual ---------- */
function addRipple(x, y, color) {
  for (let i = 0; i < 3; i++) {
    ripples.push({
      x, y,
      r: i * 12,
      maxR: 180 + Math.random() * 80,
      alpha: 0.16 - i * 0.035,
      color,
      speed: 1.8 + i * 0.35,
      wobble: Math.random() * Math.PI * 2,
      life: 1
    });
  }
}

function addInk(x, y, color) {
  const count = mode === "chord" ? 5 : 7;

  for (let i = 0; i < count; i++) {
    inks.push({
      x, y,
      vx: (Math.random() - 0.5) * 0.38,
      vy: (Math.random() - 0.5) * 0.38,
      r: Math.random() * 8 + 6,
      maxR: Math.random() * 120 + 80,
      color,
      alpha: 0.115,
      life: 1,
      angle: Math.random() * Math.PI * 2,
      twist: Math.random() * 0.025 + 0.006,
      oil: Math.random() * 0.8 + 0.4
    });
  }
}

function drawRipples() {
  ctx.globalCompositeOperation = "source-over";

  ripples.forEach((ripple, index) => {
    if (washing) {
      ripple.x += 8 * washPower;
      ripple.life *= 0.94;
    } else {
      ripple.r += ripple.speed;
      ripple.life *= 0.985;
      ripple.wobble += 0.035;
    }

    const alpha = ripple.alpha * ripple.life * (1 - ripple.r / ripple.maxR);
    if (alpha <= 0 || ripple.r > ripple.maxR) {
      ripples.splice(index, 1);
      return;
    }

    ctx.strokeStyle = rgba(ripple.color, alpha);
    ctx.lineWidth = 1.1;
    ctx.beginPath();

    const points = 96;
    for (let i = 0; i <= points; i++) {
      const a = (Math.PI * 2 * i) / points;
      const wave = Math.sin(a * 5 + ripple.wobble) * 1.8 + Math.sin(a * 9 - ripple.wobble * 0.7) * 0.8;
      const rr = ripple.r + wave;
      const x = ripple.x + Math.cos(a) * rr;
      const y = ripple.y + Math.sin(a) * rr * 0.92;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.stroke();
  });
}

function drawInk() {
  ctx.clearRect(0, 0, w, h);

  drawRipples();

  inks.forEach((ink, index) => {
    if (washing) {
      ink.x += 8 * washPower + Math.sin(ink.y * 0.02) * 2;
      ink.y += Math.sin(ink.x * 0.01) * 0.7;
      ink.life *= 0.965;
    } else {
      ink.angle += ink.twist;
      ink.x += ink.vx + Math.cos(ink.angle) * 0.2;
      ink.y += ink.vy + Math.sin(ink.angle) * 0.2;
      ink.life *= 0.996;
    }

    ink.r += (ink.maxR - ink.r) * 0.01;

    ctx.globalCompositeOperation = "source-over";

    const grad = ctx.createRadialGradient(ink.x, ink.y, 0, ink.x, ink.y, ink.r);
    grad.addColorStop(0, rgba(ink.color, ink.alpha * 1.4 * ink.life));
    grad.addColorStop(0.32, rgba(ink.color, ink.alpha * 0.72 * ink.life));
    grad.addColorStop(0.68, rgba(ink.color, ink.alpha * 0.22 * ink.life));
    grad.addColorStop(1, rgba(ink.color, 0));

    ctx.fillStyle = grad;
    ctx.beginPath();

    const points = 48;
    for (let i = 0; i <= points; i++) {
      const a = (Math.PI * 2 * i) / points;
      const oily = Math.sin(a * 2 + ink.angle) * 14 * ink.oil + Math.sin(a * 5 - ink.angle * 1.3) * 7;
      const rr = ink.r + oily;
      const px = ink.x + Math.cos(a) * rr;
      const py = ink.y + Math.sin(a) * rr * 0.86;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.closePath();
    ctx.fill();

    ctx.globalCompositeOperation = "screen";
    ctx.strokeStyle = rgba(ink.color, 0.055 * ink.life);
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = rgba(ink.color, 0.045 * ink.life);
    ctx.lineWidth = 1;

    for (let j = 0; j < 4; j++) {
      const a = ink.angle + j * 1.4;
      ctx.beginPath();
      ctx.moveTo(ink.x + Math.cos(a) * ink.r * 0.15, ink.y + Math.sin(a) * ink.r * 0.12);
      ctx.bezierCurveTo(
        ink.x + Math.cos(a + 0.5) * ink.r * 0.6,
        ink.y + Math.sin(a + 0.5) * ink.r * 0.25,
        ink.x + Math.cos(a + 1.1) * ink.r * 0.75,
        ink.y + Math.sin(a + 1.1) * ink.r * 0.55,
        ink.x + Math.cos(a + 1.7) * ink.r,
        ink.y + Math.sin(a + 1.7) * ink.r * 0.7
      );
      ctx.stroke();
    }

    if (ink.life < 0.035 || ink.x > w + 300) {
      inks.splice(index, 1);
    }
  });

  if (washing) {
    washPower *= 0.94;
    if (washPower < 0.02 || (inks.length === 0 && ripples.length === 0)) {
      washing = false;
      washPower = 0;
      inks = [];
      ripples = [];
    }
  }

  requestAnimationFrame(drawInk);
}

function rgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

drawInk();

/* ---------- Touch / Mouse ---------- */
function getNoteForPointer() {
  if (mode === "random" || mode === "chord") return randomNote();
  return current;
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  canvas.setPointerCapture?.(e.pointerId);

  const note = getNoteForPointer();
  current = note;
  updateSelected();

  const voices = startPointerSound(e.pointerId, note);

  activePointers.set(e.pointerId, {
    note,
    voices,
    lastRippleTime: Date.now(),
    moved: false
  });

  addRipple(e.clientX, e.clientY, note.color);
  addInk(e.clientX, e.clientY, note.color);
});

canvas.addEventListener("pointermove", e => {
  e.preventDefault();

  const data = activePointers.get(e.pointerId);
  if (!data) return;

  data.moved = true;
  addInk(e.clientX, e.clientY, data.note.color);

  const now = Date.now();
  if (now - data.lastRippleTime > 130) {
    addRipple(e.clientX, e.clientY, data.note.color);
    data.lastRippleTime = now;
  }
});

function endPointer(e) {
  e.preventDefault();

  const data = activePointers.get(e.pointerId);
  if (!data) return;

  // タップ1回は「ぽちゃん」感を強める
  if (!data.moved) {
    playTap(data.note);
  }

  stopPointerSound(e.pointerId);
  activePointers.delete(e.pointerId);
}

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("lostpointercapture", endPointer);

window.addEventListener("blur", stopAllSounds);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopAllSounds();
});

window.addEventListener("keydown", e => {
  const note = notes.find(n => n.key === e.key.toLowerCase());
  if (!note) return;

  mode = "normal";
  current = note;
  updateSelected();

  const x = Math.random() * w;
  const y = Math.random() * h;

  playTap(note);
  addRipple(x, y, note.color);
  addInk(x, y, note.color);
});
</script>

</body>
</html>
